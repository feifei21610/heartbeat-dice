name: Deploy backend

on:
  push:
    branches: [main]
    # ★ 只有服务端 / 引擎改动才重启后端，否则改个 CSS 也把在线的人踢下线（playbook §8 坑 3）
    paths:
      - 'packages/server/**'
      - 'packages/shared/**'
      - 'fly.toml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 引擎 + 房间集成测试
        run: npm test
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
